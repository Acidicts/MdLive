name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: mdlive-linux-x86_64
          - os: ubuntu-22.04-arm
            asset_name: mdlive-linux-arm64
          - os: macos-latest
            asset_name: mdlive-darwin-arm64
          - os: macos-15-intel
            asset_name: mdlive-darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - run: pyinstaller mdlive.spec
      - run: mv dist/mdlive dist/${{ matrix.asset_name }}
        shell: bash
      - name: Smoke test (help)
        run: |
          chmod +x dist/${{ matrix.asset_name }}
          ./dist/${{ matrix.asset_name }} --help
        shell: bash

      - name: Smoke test (actually starts and serves)
        run: |
          echo "# test" > /tmp/test.md
          ./dist/${{ matrix.asset_name }} /tmp/test.md --port 8123 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8123/ | grep -q "<h1"
          kill $SERVER_PID
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true
