[project]
name = "mdlive"
version = "0.1.0"
description = "Serve a Markdown file as live-updating HTML"
requires-python = ">=3.9"
dependencies = [
    "watchfiles>=0.21",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "textual>=0.40",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pyinstaller"]

[project.scripts]
mdlive = "mdlive.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
