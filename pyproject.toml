[project]
name = "mdlive"
version = "0.1.0"
description = "Serve a Markdown file as live-updating HTML"
requires-python = ">=3.9"
dependencies = [
    "markdown",
    "watchfiles",
    "starlette",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pyinstaller"]

[project.scripts]
mdlive = "mdlive.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
